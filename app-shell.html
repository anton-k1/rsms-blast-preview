<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SMS Blast — in app</title>
<style>
 :root{--pri:#2563eb;--ink:#0f172a;--mut:#6b7280;--faint:#9aa1af;--bd:#eef0f4;--bg:#eef1f5}
 *{box-sizing:border-box}html,body{margin:0;height:100%;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;color:var(--ink);overflow:hidden}
 .app{display:grid;grid-template-columns:230px 1fr;grid-template-rows:60px 1fr;height:100vh}
 /* sidebar */
 .side{grid-row:1/3;border-right:1px solid var(--bd);background:#fff;display:flex;flex-direction:column;padding:14px 12px;gap:2px;overflow:auto}
 .brand{display:flex;align-items:center;gap:10px;padding:6px 8px 14px;font-weight:800;font-size:15px}
 .brand .av{width:30px;height:30px;border-radius:9px;background:var(--pri);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800}
 .sec{font-size:10.5px;font-weight:800;letter-spacing:.06em;color:var(--faint);padding:14px 8px 5px;text-transform:uppercase}
 .nav{display:flex;align-items:center;gap:11px;padding:8px 10px;border-radius:9px;font-size:14px;font-weight:600;color:var(--mut);cursor:pointer;text-decoration:none}
 .nav svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.6}
 .nav:hover{background:#f5f7fb;color:var(--ink)}
 .nav.on{background:var(--pri);color:#fff}
 .acct{margin-top:auto;display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:9px;border:1px solid var(--bd);font-size:13px;font-weight:600}
 .acct .av{width:26px;height:26px;border-radius:50%;background:#e6ecfb;color:var(--pri);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800}
 /* topbar */
 .top{grid-column:2;display:flex;align-items:center;gap:14px;padding:0 20px;border-bottom:1px solid var(--bd);background:#fff}
 .ask{flex:1;max-width:560px;margin:0 auto;display:flex;align-items:center;gap:9px;height:38px;padding:0 14px;border:1px solid #e5e7ef;border-radius:11px;color:var(--faint);font-size:13.5px}
 .ask .sp{width:22px;height:22px;border-radius:7px;background:linear-gradient(135deg,#2563eb,#0ea5e9);display:flex;align-items:center;justify-content:center;color:#fff;font-size:12px}
 .bal{display:inline-flex;align-items:center;gap:7px;height:34px;padding:0 13px;border:1px solid #e5e7ef;border-radius:99px;font-size:13px;font-weight:700}
 .dial{display:inline-flex;align-items:center;gap:7px;height:34px;padding:0 15px;border-radius:99px;background:var(--pri);color:#fff;font-size:13px;font-weight:700}
 .ic{width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;color:var(--mut)}
 /* main = the composer, isolated in an iframe */
 .main{grid-column:2;position:relative;background:var(--bg);overflow:hidden}
 .crumb{position:absolute;top:0;left:0;right:0;height:0}
 iframe{width:100%;height:100%;border:0;display:block}
 @media(max-width:820px){.app{grid-template-columns:1fr}.side{display:none}.top{grid-column:1}.main{grid-column:1}}
</style></head><body>
<div class="app">
 <aside class="side">
  <div class="brand"><span class="av">R</span> Ralph</div>
  <a class="nav"><svg viewBox="0 0 24 24"><path d="M3 9.5 12 3l9 6.5V21H3z"/></svg>Home</a>
  <div class="sec">Messaging</div>
  <a class="nav"><svg viewBox="0 0 24 24"><path d="M4 4h16v12H7l-3 3z"/></svg>Inbox</a>
  <a class="nav on"><svg viewBox="0 0 24 24"><path d="M22 2 11 13"/><path d="M22 2 15 22l-4-9-9-4z"/></svg>SMS</a>
  <a class="nav"><svg viewBox="0 0 24 24"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2 4.2 2 2 0 0 1 4 2h3a2 2 0 0 1 2 1.7c.1 1 .4 1.9.7 2.8a2 2 0 0 1-.5 2.1L8 9.9a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.8.7A2 2 0 0 1 22 16.9z"/></svg>Dialer</a>
  <div class="sec">Automation</div>
  <a class="nav"><svg viewBox="0 0 24 24"><path d="M13 2 3 14h9l-1 8 10-12h-9z"/></svg>AI</a>
  <a class="nav"><svg viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/></svg>CRM</a>
  <div class="sec">Account</div>
  <a class="nav"><svg viewBox="0 0 24 24"><path d="M3 3v18h18"/><path d="m7 14 4-4 3 3 5-6"/></svg>Reports</a>
  <a class="nav"><svg viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>Registration</a>
  <a class="nav"><svg viewBox="0 0 24 24"><path d="M4 9h16M4 15h16M10 3 8 21M16 3l-2 18"/></svg>Numbers</a>
  <div class="acct"><span class="av">R</span> My Account</div>
 </aside>
 <header class="top">
  <div class="ask"><span class="sp">✦</span> Ask AI anything…</div>
  <span class="bal">💳 $29.91</span>
  <span class="dial"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M22 16.9v3a2 2 0 0 1-2.2 2A19.8 19.8 0 0 1 2 4.2 2 2 0 0 1 4 2h3a2 2 0 0 1 2 1.7c.4 2 .9 3 .2 3.9L8 9a16 16 0 0 0 6 6l1.3-1.3c.9-.7 1.9-.2 3.9.2A2 2 0 0 1 22 16.9z"/></svg> Dialer</span>
  <span class="ic">💬</span><span class="ic">🔔</span><span class="ic">⚙</span>
 </header>
 <main class="main"><iframe src="fc-native.html" title="SMS blast composer"></iframe></main>
</div>
</body></html>
